services:
  svc-wallet:
    build: ./svc-wallet
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: "8000"
      MONGO_URI: "${MONGO_URI}"
      MONGO_NAME: "svc-wallet"

  svc-transactions:
    build: ./svc-transactions
    ports:
      - "8001:8001"
    environment:
      SERVER_PORT: "8001"
      MONGO_URI: "${MONGO_URI}"
      MONGO_NAME: "svc-transactions"
      WALLET_SERVICE_URL: "http://svc-wallet:8000"
    depends_on:
      - svc-wallet